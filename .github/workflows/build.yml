name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build static proot for arm64 (NDK)
        run: |
          set -x
          OUT="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUT"

          # 1) 安装 Android NDK
          NDK_VERSION="25.2.9519653"
          echo "ndk;${NDK_VERSION}" > /tmp/ndk-pkg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null 2>&1 \
            || $ANDROID_HOME/tools/bin/sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null 2>&1 || true
          NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK" ]; then
            NDK=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          fi
          echo "NDK=$NDK"
          ls "$NDK/toolchains/llvm/prebuilt/" 2>/dev/null

          # 2) 拉取 proot 源码
          cd /tmp
          rm -rf proot-src
          git clone --depth 1 https://github.com/proot-me/proot.git proot-src || exit 0
          cd proot-src/src

          # 3) 用 NDK clang 静态编译（关闭 talloc 依赖）
          TC=$(echo "$NDK"/toolchains/llvm/prebuilt/*)
          CC="$TC/bin/aarch64-linux-android29-clang"
          echo "CC=$CC"
          $CC --version | head -2

          make -j4 \
            CC="$CC" \
            LD="$CC" \
            CFLAGS="-static -O2 -D__ANDROID_API__=29 -I. -I$TC/sysroot/usr/include" \
            LDFLAGS="-static" \
            proot 2>&1 | tail -30 || true

          if [ -f proot ]; then
            cp proot "$OUT/libproot.so"
            chmod +x "$OUT/libproot.so"
            echo "=== proot built: $(stat -c%s $OUT/libproot.so) bytes ==="
            $TC/bin/llvm-readelf -d "$OUT/libproot.so" 2>/dev/null | head -10 || true
          else
            echo "=== proot build FAILED, will use fallback sandbox ==="
            ls -la
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK output
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShaoyuNB-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false