name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build static proot for arm64 (NDK, optional)
        continue-on-error: true
        run: |
          OUT="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUT"
          NDK_VERSION="25.2.9519653"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VERSION}" > /dev/null 2>&1 || true
          NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          [ -d "$NDK" ] || NDK=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | head -1)
          echo "NDK=$NDK"
          cd /tmp
          rm -rf proot-src proot.tar.gz
          OK=0
          for URL in \
            "https://codeload.github.com/proot-me/proot/tar.gz/refs/heads/master" \
            "https://github.com/proot-me/proot/archive/refs/heads/master.tar.gz"; do
            echo "try $URL"
            if curl -fsSL --retry 2 --max-time 180 -o proot.tar.gz "$URL"; then OK=1; break; fi
          done
          if [ "$OK" != "1" ]; then echo "=== proot source download FAILED (ok, fallback) ==="; exit 0; fi
          mkdir -p proot-src && tar xzf proot.tar.gz -C proot-src --strip-components=1
          cd proot-src/src
          TC=$(echo "$NDK"/toolchains/llvm/prebuilt/*)
          CC="$TC/bin/aarch64-linux-android29-clang"
          make -j4 CC="$CC" LD="$CC" \
            CFLAGS="-static -O2 -D__ANDROID_API__=29 -I. -I$TC/sysroot/usr/include" \
            LDFLAGS="-static" proot 2>&1 | tail -20 || true
          if [ -f proot ]; then
            cp proot "$OUT/libproot.so"; chmod +x "$OUT/libproot.so"
            echo "=== proot built: $(stat -c%s $OUT/libproot.so) bytes ==="
          else
            echo "=== proot build FAILED (ok, fallback sandbox 仍可用) ==="
          fi

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/shaoyu.keystore
          ls -la $RUNNER_TEMP/shaoyu.keystore

      - name: Build Debug APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/shaoyu.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK output
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShaoyuNB-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false